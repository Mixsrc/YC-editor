<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="YC Studio : éditeur et bibliothécaire pour Yamaha YC61, YC73 et YC88. Démonstration avec un YC73 virtuel.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%23d63b2c%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-family=%22Arial%22 font-weight=%22bold%22 font-size=%2215%22 fill=%22white%22 text-anchor=%22middle%22%3EYC%3C/text%3E%3C/svg%3E">
  <title>YC Studio — démo</title>
  <style>
:root {
  /* Thème clair (défaut) — ivoire chaleureux */
  --bg: #f4f0e9;
  --bg2: #fbf8f3;
  --panel: #ffffff;
  --panel2: #f5f1ea;
  --line: #e6dfd4;
  --line2: #d5ccbe;
  --text: #2b2521;
  --muted: #72685f;
  --dim: #a0968b;
  --accent: #d63b2c;        /* rouge YC */
  --accent2: #e85343;
  --accent-soft: rgba(214,59,44,.10);
  --amber: #d98a14;
  --ok: #2f9e6a;
  --blue: #2f7fd8;
  --organ: #d63b2c;
  --keysA: #e08a12;
  --keysB: #2f7fd8;
  --tint-organ: #fdece9;
  --tint-keysA: #fdf2df;
  --tint-keysB: #e8f1fc;
  --tint-neutral: #f3efe8;
  --tint-ok: #e5f5ec;
  --hover: #f2ede5;
  --shadow: 0 1px 2px rgba(60,40,20,.06), 0 4px 14px rgba(60,40,20,.06);
  --knob-track: #e7e1d8;
  --knob-cap: #ffffff;
  --knob-cap-line: #d8d0c4;
  --knob-ind: #2b2521;
  --housing: #1c1a18;       /* boîtier des tirettes, noir comme sur le clavier */
  --slot: #0c0b0a;
  --scroll: #d5ccbe;
  --radius: 12px;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
}
body.dark {
  --bg: #121418; --bg2: #181b20; --panel: #1e2228; --panel2: #252a31; --line: #2e343c; --line2: #3a414b;
  --text: #e8e6e3; --muted: #8d939c; --dim: #5d636c; --accent: #e0483a; --accent2: #ff6a57; --accent-soft: rgba(224,72,58,.18);
  --amber: #f2a93b; --ok: #4cc38a; --blue: #5aa6ff; --organ: #e0483a; --keysA: #f2a93b; --keysB: #5aa6ff;
  --tint-organ: rgba(224,72,58,.10); --tint-keysA: rgba(242,169,59,.09); --tint-keysB: rgba(90,166,255,.09); --tint-neutral: rgba(255,255,255,.03); --tint-ok: rgba(76,195,138,.08);
  --hover: #252a31; --shadow: none;
  --knob-track: #323840; --knob-cap: #2c3238; --knob-cap-line: #3c434c; --knob-ind: #e8e6e3;
  --housing: #15171b; --slot: #0b0c0e; --scroll: #2f353d;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 var(--font); overflow: hidden; user-select: none; }
input, select, button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.spacer { flex: 1; }
.muted { color: var(--muted); font-weight: 400; }
[hidden] { display: none !important; }

/* ---------- Barre du haut ---------- */
.topbar { height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: var(--bg2); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; margin-right: 6px; }
.logo { background: linear-gradient(135deg, var(--accent2), var(--accent)); color: #fff; font-weight: 800; letter-spacing: .5px; padding: 3px 7px; border-radius: 6px; font-size: 13px; }
.brand-name { font-weight: 600; font-size: 15px; letter-spacing: .3px; }
.conn { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; }
.conn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.conn.on .dot { background: var(--ok); box-shadow: 0 0 0 3px rgba(76,195,138,.18); }
.conn .caret { color: var(--muted); font-size: 10px; }
.btn-group { display: flex; gap: 6px; }
.btn { background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--dim); background: var(--hover); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent2); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--hover); }
.btn.icon { font-size: 16px; padding: 4px 9px; }
.btn.small { padding: 3px 9px; font-size: 12px; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.badge { background: rgba(0,0,0,.18); border-radius: 999px; padding: 0 7px; font-size: 11px; min-width: 18px; text-align: center; }
.link { background: none; border: 0; color: var(--muted); padding: 2px 6px; }
.link:hover { color: var(--text); }

/* ---------- Mise en page ---------- */
.layout { display: flex; height: calc(100% - 60px); }
.sidebar { width: 330px; min-width: 280px; background: var(--bg2); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.editor { flex: 1; overflow: auto; padding: 18px 22px 30px; }

.side-tabs { display: flex; padding: 10px 10px 0; gap: 4px; }
.side-tabs button { flex: 1; background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 8px 4px; color: var(--muted); font-weight: 600; }
.side-tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
.side-search { padding: 10px; }
.side-search input { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; outline: none; }
.side-search input:focus { border-color: var(--accent); }
.side-filters { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 10px 8px; }
.chip { background: var(--panel); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 2px 9px; font-size: 11.5px; }
.chip.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.side-list { flex: 1; overflow: auto; padding: 0 6px 10px; }
.side-foot { padding: 8px 10px; border-top: 1px solid var(--line); display: flex; gap: 6px; }

.page-head { position: sticky; top: 0; z-index: 2; background: var(--bg2); display: flex; align-items: center; gap: 6px; padding: 8px 6px 4px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .8px; font-weight: 700; }
.page-head .spacer { border-top: 1px solid var(--line); flex: 1; margin-left: 4px; }
.page-head .link { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 11px; }
.row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; border: 1px solid transparent; cursor: default; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--panel); border-color: var(--accent); box-shadow: var(--shadow); }
.row.drop { border-color: var(--accent); background: var(--accent-soft); }
.row.dragging { opacity: .4; }
.row .num { font-family: var(--mono); color: var(--dim); font-size: 11px; width: 34px; flex: none; }
.row .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.row .nm.empty { color: var(--dim); font-weight: 400; font-style: italic; }
.row .tags { display: flex; gap: 3px; flex: none; }
.row .fav { color: var(--amber); }
.row .mod { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); flex: none; }
.sect-tag { font-size: 10.5px; padding: 1px 6px; border-radius: 4px; background: var(--tint-neutral); color: var(--muted); white-space: nowrap; }
.sect-tag.organ { color: var(--organ); background: var(--tint-organ); font-weight: 600; }
.sect-tag.keysA { color: var(--keysA); background: var(--tint-keysA); font-weight: 600; }
.sect-tag.keysB { color: var(--keysB); background: var(--tint-keysB); font-weight: 600; }

/* ---------- Éditeur ---------- */
.ed-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.ed-name { font-size: 22px; font-weight: 650; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 2px 8px; width: 290px; outline: none; letter-spacing: .2px; }
.ed-name:hover { border-color: var(--line); }
.ed-name:focus { border-color: var(--accent); background: var(--panel); }
.ed-origin { color: var(--muted); font-size: 12px; }
.ed-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.ed-tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; color: var(--muted); font-weight: 600; }
.ed-tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
.empty-state { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); gap: 12px; text-align: center; }
.empty-state h2 { color: var(--text); margin: 0; font-weight: 600; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 16px 16px; position: relative; box-shadow: var(--shadow); overflow: hidden; }
.card.off { opacity: .62; }
.card.wide { grid-column: 1 / -1; }
.card-head { display: flex; align-items: center; gap: 10px; margin: 0 -16px 14px; padding: 10px 16px; background: var(--card-tint, var(--tint-neutral)); border-bottom: 1px solid var(--line); }
.card-title { font-weight: 700; font-size: 13px; letter-spacing: .6px; text-transform: uppercase; }
.card-title .bar { display: inline-block; width: 4px; height: 13px; border-radius: 2px; margin-right: 8px; vertical-align: -1px; }
.sub { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .7px; font-weight: 700; margin: 14px 0 8px; display: flex; align-items: center; gap: 8px; }
.sub::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.ctl-row { display: flex; flex-wrap: wrap; gap: 14px 10px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label { color: var(--muted); font-size: 11px; }
.field.disabled { opacity: .35; pointer-events: none; }
.field select, .field input[type=text], .field input[type=number] { background: var(--panel2); border: 1px solid var(--line2); border-radius: 7px; padding: 5px 8px; outline: none; min-width: 120px; }
.field select:focus, .field input:focus { border-color: var(--accent); }

/* Interrupteur */
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.switch .track { width: 34px; height: 19px; border-radius: 999px; background: var(--line2); position: relative; transition: background .15s; flex: none; }
.switch .track::after { content: ""; position: absolute; width: 15px; height: 15px; top: 2px; left: 2px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch.on .track { background: var(--accent); }
.switch.on .track::after { transform: translateX(15px); background: #fff; }
.switch .lbl { font-size: 12px; }

/* Segmenté */
.seg { display: inline-flex; background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { background: transparent; border: 0; border-radius: 6px; padding: 4px 9px; color: var(--muted); font-size: 12px; font-weight: 600; }
.seg button:hover { color: var(--text); }
.seg button.active { background: var(--accent); color: #fff; box-shadow: 0 1px 3px rgba(214,59,44,.35); }
.seg .sep { width: 1px; background: var(--line2); margin: 3px 2px; }

/* Potentiomètre */
.knob { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 62px; }
.knob svg { cursor: ns-resize; touch-action: none; }
.knob .kv { font-family: var(--mono); font-size: 11px; color: var(--text); min-height: 15px; white-space: nowrap; }
.knob .kl { font-size: 10.5px; color: var(--muted); text-align: center; line-height: 1.15; }
.knob.disabled { opacity: .3; pointer-events: none; }

/* Tirettes */
.drawbars { display: flex; gap: 10px; padding: 10px 12px 6px; background: var(--housing); border-radius: 8px; border: 1px solid var(--line); justify-content: center; }
.db { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 34px; }
.db .slot { width: 18px; height: 170px; background: var(--slot); border-radius: 4px; position: relative; cursor: ns-resize; box-shadow: inset 0 2px 6px rgba(0,0,0,.6); touch-action: none; }
.db .rod { position: absolute; left: 3px; right: 3px; top: 0; border-radius: 2px; background: repeating-linear-gradient(to bottom, rgba(255,255,255,.08) 0 1px, transparent 1px 18px); }
.db .cap { position: absolute; left: -7px; width: 32px; height: 26px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; box-shadow: 0 3px 8px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.35); }
.db.brown .cap { background: linear-gradient(#8a4b2a, #6b371d); color: #f5e6da; }
.db.white .cap { background: linear-gradient(#f4f1ea, #d8d3c8); color: #222; }
.db.black .cap { background: linear-gradient(#3a3a3a, #161616); color: #eee; }
.db .ft { font-size: 10.5px; color: #b9b0a5; }
.reg { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.reg input { font-family: var(--mono); letter-spacing: 3px; width: 128px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 7px; padding: 4px 8px; outline: none; }

/* Choix de voix */
.voice-btn { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 12px; min-width: 230px; text-align: left; }
.voice-btn:hover { border-color: var(--accent); }
.voice-btn .vn { font-weight: 650; font-size: 14px; }
.voice-btn .vs { color: var(--muted); font-size: 11px; }
.popover { position: fixed; z-index: 50; background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; box-shadow: 0 18px 50px rgba(40,25,10,.25); padding: 10px; }
.vp { width: 520px; max-height: 470px; display: flex; flex-direction: column; gap: 8px; }
.vp input { background: var(--panel2); border: 1px solid var(--line2); border-radius: 7px; padding: 6px 9px; outline: none; }
.vp-list { overflow: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px 6px; }
.vp-group { grid-column: 1 / -1; color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .7px; font-weight: 700; padding: 8px 4px 2px; }
.vp-item { background: transparent; border: 0; text-align: left; padding: 5px 8px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vp-item:hover, .vp-item.hl { background: var(--panel2); }
.vp-item.active { background: var(--accent); color: #fff; }

/* Menus, modales, toasts */
.ctxmenu { position: fixed; z-index: 60; background: var(--panel); border: 1px solid var(--line2); border-radius: 9px; box-shadow: 0 14px 40px rgba(40,25,10,.22); padding: 5px; min-width: 220px; }
.ctxmenu button { display: flex; width: 100%; justify-content: space-between; background: none; border: 0; text-align: left; padding: 6px 10px; border-radius: 6px; }
.ctxmenu button:hover { background: var(--panel2); }
.ctxmenu button:disabled { opacity: .4; }
.ctxmenu .kb { color: var(--dim); font-size: 11px; }
.ctxmenu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.modal-back { position: fixed; inset: 0; background: rgba(30,20,10,.35); z-index: 70; display: flex; align-items: center; justify-content: center; }
.modal { background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; padding: 22px; width: 480px; box-shadow: 0 30px 80px rgba(30,20,10,.3); }
.modal h3 { margin: 0 0 14px; }
.modal .field { margin-bottom: 12px; }
.modal .field select, .modal .field input { width: 100%; }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.modal .hint { color: var(--muted); font-size: 12px; }
.toast { position: fixed; bottom: 42px; left: 50%; transform: translateX(-50%); background: #2b2521; color: #fff; border: 1px solid var(--line2); padding: 9px 16px; border-radius: 9px; z-index: 80; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.toast.err { border-color: var(--accent); }

/* Barre d'état et moniteur */
.statusbar { height: 28px; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: var(--bg2); border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.progress { display: flex; align-items: center; gap: 8px; }
.progress .bar { width: 220px; height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.progress .bar::after { content: ""; position: absolute; inset: 0; width: var(--p, 0%); background: var(--accent); transition: width .15s; }
.drawer { position: fixed; right: 12px; bottom: 36px; width: 620px; height: 300px; background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; z-index: 40; display: flex; flex-direction: column; box-shadow: 0 18px 50px rgba(40,25,10,.25); }
.drawer-head { display: flex; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.drawer pre { flex: 1; margin: 0; overflow: auto; padding: 8px 12px; font: 11px/1.5 var(--mono); color: var(--muted); user-select: text; }
.drawer pre .out { color: var(--accent); }
.drawer pre .in { color: var(--ok); }

/* Tableau des paramètres */
.ptable { width: 100%; border-collapse: collapse; }
.ptable td { padding: 4px 8px; border-bottom: 1px solid var(--line); }
.ptable td:first-child { color: var(--muted); width: 45%; }
.ptable td.addr { font-family: var(--mono); color: var(--dim); font-size: 11px; width: 90px; }
.ptable select, .ptable input { background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; padding: 3px 6px; width: 100%; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 6px; border: 2px solid var(--bg2); }
::-webkit-scrollbar-track { background: transparent; }

/* Touches de couleur */
.topbar { box-shadow: 0 1px 0 var(--line); }
.card.organ { --card-tint: var(--tint-organ); }
.card.keysA { --card-tint: var(--tint-keysA); }
.card.keysB { --card-tint: var(--tint-keysB); }
.card.ok { --card-tint: var(--tint-ok); }
.card.blue { --card-tint: var(--tint-keysB); }
.card.organ .card-title { color: var(--organ); }
.card.keysA .card-title { color: var(--keysA); }
.card.keysB .card-title { color: var(--keysB); }
.card.plain { padding: 12px 16px; }
.empty-state .card { padding-bottom: 16px; }
.editor { background: radial-gradient(1200px 500px at 70% -10%, var(--tint-organ), transparent 60%); }
body.dark .editor { background: none; }

/* ---------- Variantes de thème ---------- */
body.vintage {
  --bg: #efe4d2; --bg2: #f7efe2; --panel: #fffaf1; --panel2: #f3e8d6; --line: #e0d0b6; --line2: #cdb894;
  --text: #3a2618; --muted: #7d6247; --dim: #a8906f; --accent: #b4441f; --accent2: #cc5a2f; --accent-soft: rgba(180,68,31,.10);
  --amber: #c27a12; --ok: #4f8a3c; --blue: #3c6e8f; --organ: #b4441f; --keysA: #b8760f; --keysB: #3c6e8f;
  --tint-organ: #f7e1d3; --tint-keysA: #f6e9cf; --tint-keysB: #e2ebef; --tint-neutral: #f1e6d3; --tint-ok: #e6eddc;
  --hover: #f1e6d3; --knob-track: #e3d4bb; --knob-cap: #fffaf1; --knob-cap-line: #cdb894; --knob-ind: #3a2618;
  --housing: #2b1c12; --slot: #120b06; --scroll: #cdb894;
}
body.vintage .topbar { background: linear-gradient(#5a3a22, #4a2f1b); border-bottom-color: #3a2416; }
body.vintage .topbar .brand-name, body.vintage .topbar .btn.ghost, body.vintage .topbar .conn { color: #f6e6cf; }
body.vintage .topbar .conn { background: rgba(0,0,0,.2); border-color: rgba(255,255,255,.15); }
body.vintage .topbar .btn:not(.primary):not(.ghost) { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.18); color: #f6e6cf; }

body.ocean {
  /* Océan : bleu profond (plus foncé que l'ancienne version, nettement distinct du noir de Scène) */
  --bg: #102538; --bg2: #16324d; --panel: #1b3b5a; --panel2: #214566; --line: #2b5274; --line2: #376186;
  --text: #e8f2fa; --muted: #a3bfd6; --dim: #6f8ea9; --accent: #3ab0e8; --accent2: #5cc3f2; --accent-soft: rgba(58,176,232,.18);
  --amber: #f2b441; --ok: #46d19a; --blue: #3ab0e8; --organ: #ff6b5a; --keysA: #f2b441; --keysB: #5cc3f2;
  --tint-organ: rgba(255,107,90,.12); --tint-keysA: rgba(242,180,65,.11); --tint-keysB: rgba(92,195,242,.12); --tint-neutral: rgba(255,255,255,.04); --tint-ok: rgba(70,209,154,.1);
  --hover: #214566; --shadow: 0 2px 10px rgba(0,0,0,.25); --knob-track: #2b5274; --knob-cap: #214566; --knob-cap-line: #3d6a91; --knob-ind: #e8f2fa;
  --housing: #0b1a28; --slot: #060f18; --scroll: #376186;
}
body.ocean .editor { background: none; }
body.sage {
  /* Fleuri : pop « flower power » — crème soleil, mandarine, moutarde, bleuet */

  --text: #2e1f3d; --muted: #6e5a73; --dim: #a8949f; --accent: #ee5a12; --accent2: #f57a2e; --accent-soft: rgba(238,90,18,.12);
  --amber: #d99a00; --ok: #3b5bd9; --blue: #3b5bd9; --organ: #ee5a12; --keysA: #d99a00; --keysB: #3b5bd9;
  --tint-organ: #fde4d3; --tint-keysA: #fbefcc; --tint-keysB: #e1e6fb; --tint-neutral: #fdf0d6; --tint-ok: #e1e6fb;
  --hover: #fdf0d6; --knob-track: #f0dcb4; --knob-cap: #fffdf7; --knob-cap-line: #e2c288; --knob-ind: #2e1f3d; --scroll: #e2c288;
}

body.sage .topbar .btn:not(.primary):not(.ghost) { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.3); color: #fffaf0; }

body.stage {
  --bg: #000; --bg2: #0a0a0a; --panel: #111; --panel2: #1c1c1c; --line: #333; --line2: #4a4a4a;
  --text: #fff; --muted: #c8c8c8; --dim: #8a8a8a; --accent: #ff3b2f; --accent2: #ff5a4f; --accent-soft: rgba(255,59,47,.2);
  --amber: #ffb020; --ok: #3ddc84; --blue: #4da3ff; --organ: #ff3b2f; --keysA: #ffb020; --keysB: #4da3ff;
  --tint-organ: rgba(255,59,47,.14); --tint-keysA: rgba(255,176,32,.12); --tint-keysB: rgba(77,163,255,.12); --tint-neutral: #161616; --tint-ok: rgba(61,220,132,.1);
  --hover: #1c1c1c; --shadow: none; --knob-track: #333; --knob-cap: #222; --knob-cap-line: #555; --knob-ind: #fff;
  --housing: #0a0a0a; --slot: #000; --scroll: #444;
}
body.stage, body.stage .editor { font-size: 14px; }
body.stage .editor, body.dark .editor { background: none; }

.theme-pick { display: flex; gap: 4px; align-items: center; padding: 3px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); }
.theme-pick button { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
.theme-pick button.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--panel); }

/* ---------- Panneau Réglages latéral ---------- */
.modal-back.side { justify-content: flex-end; align-items: stretch; }
.modal-back.side .modal { width: 460px; max-width: 92vw; height: 100%; border-radius: 0; padding: 0; display: flex; flex-direction: column; animation: slideIn .18s ease-out; border-width: 0 0 0 1px; }
@keyframes slideIn { from { transform: translateX(40px); opacity: .4; } to { transform: none; opacity: 1; } }
.modal-back.side .modal > div { display: flex; flex-direction: column; height: 100%; }
.set-head { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.set-head h3 { margin: 0; }
.set-body { flex: 1; overflow: auto; padding: 4px 18px 24px; }
.set-sec { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; padding: 18px 0 8px; }
.set-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.set-lbl { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.set-col { display: flex; flex-direction: column; gap: 6px; padding-bottom: 10px; }
.set-col label { color: var(--muted); font-size: 12px; }
.set-body input, .set-body select { background: var(--panel2); border: 1px solid var(--line2); border-radius: 7px; padding: 6px 9px; outline: none; color: var(--text); }
.set-body input:focus, .set-body select:focus { border-color: var(--accent); }
.set-actions { display: flex; gap: 8px; padding: 8px 0; flex-wrap: wrap; }
.theme-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.theme-card { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 4px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel); font-size: 11.5px; font-weight: 600; }
.theme-card .sw { width: 54px; height: 34px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.theme-card.active { border-color: var(--accent); }
.btn.gear { padding: 6px 8px; }

/* Pages repliables (liste Clavier) */
.page-head { cursor: pointer; border-radius: 8px; margin: 2px 0; padding: 8px 8px; }
.page-head:hover { background: var(--hover); }
.page-head .chev { width: 12px; color: var(--muted); }
.page-head.open { color: var(--text); }
.page-head .page-prev { flex: 1; min-width: 0; margin-left: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 11.5px; color: var(--dim); }
.page-head .mod { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }

/* =================== Interface v2 (maquettes) =================== */
.topbar { height: 60px; gap: 10px; position: relative; z-index: 30; }
#search { width: 220px; padding: 7px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); outline: none; }
#search:focus { border-color: var(--accent); }
.vsep { width: 1px; height: 28px; background: var(--line); }
.title-wrap { flex: 1; min-width: 0; text-align: center; }
.title { font-size: 24px; font-weight: 800; letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-block; max-width: 100%; cursor: text; }
.topbar input.rename { font-size: 22px; font-weight: 800; text-align: center; width: 320px; }
.topbar .btn.icon { width: 36px; height: 36px; padding: 0; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 9px; color: var(--text); }
.topbar .btn.icon:hover:not(:disabled) { background: var(--hover); }
.topbar .btn.icon:disabled { opacity: .3; }

.conn { cursor: pointer; font-weight: 600; white-space: nowrap; }
.conn.on .dot { background: var(--ok); box-shadow: 0 0 0 3px rgba(47,158,106,.18); }
.conn.busy .dot { background: var(--amber); animation: pulse 1s infinite; }
.conn.warn .dot { background: var(--amber); }
.conn.warn { color: var(--amber); }
.conn.off .dot { background: var(--accent); }
@keyframes pulse { 50% { opacity: .35; } }
.conn-pop { display: flex; flex-direction: column; gap: 6px; width: 300px; }
.conn-pop label { font-size: 11px; color: var(--muted); margin-top: 4px; }
.conn-pop select { padding: 5px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); }
.conn-pop .pend { margin-top: 6px; padding: 8px; border-radius: 8px; background: var(--tint-keysA); }
.row-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.small { font-size: 11.5px; }

/* Colonne de gauche */
.sidebar { position: relative; }
.side-filters { display: flex; gap: 5px; padding: 10px 10px 6px; flex-wrap: wrap; }
.side-list { flex: 1; overflow: auto; padding: 0 8px 10px; }
.row .grip, .lib-item .grip, .sect-head .grip { color: var(--dim); cursor: grab; font-size: 11px; letter-spacing: -2px; flex: none; }
.row input.rename, .lib-item input.rename { flex: 1; min-width: 0; padding: 2px 6px; border: 1px solid var(--accent); border-radius: 5px; background: var(--panel); outline: none; }
.page-head.drop, .lib-list.drop { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--accent-soft); }
.empty-side { padding: 20px; color: var(--muted); text-align: center; }
.side-progress { border-top: 1px solid var(--line); padding: 7px 12px 9px; background: var(--bg2); }
.pg-line { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-bottom: 5px; }
.pg-bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.pg-bar > div { height: 100%; background: var(--accent); transition: width .2s; }

/* Éditeur : sections */
.editor { padding: 14px 18px 30px; }
.sections { display: flex; flex-direction: column; gap: 10px; max-width: 1180px; margin: 0 auto; }
.sect { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.sect.organ { background: linear-gradient(var(--tint-organ), var(--panel) 70%); }
.sect.keysA { background: linear-gradient(var(--tint-keysA), var(--panel) 70%); }
.sect.keysB { background: linear-gradient(var(--tint-keysB), var(--panel) 70%); }
.sect.off { opacity: .6; background: var(--panel); }
.sect.drop { outline: 2px dashed var(--accent); outline-offset: 2px; }
.sect-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; }
.sect-toggle { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; text-align: left; }
.sect-toggle .chev { color: var(--muted); width: 12px; }
.sect-toggle .bar { width: 4px; height: 16px; border-radius: 2px; background: var(--dim); }
.sect.organ .bar { background: var(--organ); } .sect.keysA .bar { background: var(--keysA); } .sect.keysB .bar { background: var(--keysB); } .sect.fx .bar { background: var(--muted); }
.sect-title { font-weight: 800; font-size: 14px; letter-spacing: .3px; text-transform: uppercase; }
.sect-sum { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sect-body { padding: 4px 14px 14px; }
.power { display: inline-flex; align-items: center; gap: 7px; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 5px 3px 10px; font-size: 11.5px; color: var(--muted); }
.power .track { width: 28px; height: 16px; border-radius: 8px; background: var(--line2); position: relative; }
.power .track::after { content: ''; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: left .15s; }
.power.on { color: var(--ok); border-color: var(--ok); }
.power.on .track { background: var(--ok); }
.power.on .track::after { left: 14px; }
.origin-note { padding: 8px 12px; border-radius: 9px; background: var(--tint-keysB); color: var(--muted); font-size: 12px; }

/* Façade orgue */
.facade { display: grid; grid-template-columns: minmax(250px, auto) auto auto; gap: 18px; align-items: start; }
.col-a { display: flex; flex-direction: column; gap: 10px; }
.col-b { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.col-c { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.knob-grid { display: grid; grid-template-columns: repeat(2, 62px); gap: 6px 10px; }
.ctl-row.tight { gap: 10px; align-items: flex-end; }
.seg.ul button { font-weight: 700; letter-spacing: .5px; }
.col-b .drawbars { padding: 8px 10px 4px; gap: 8px; }
.col-b .db .slot { height: 126px; }
.reg-line { display: flex; align-items: center; gap: 12px; }
.reg-link { background: none; border: 0; font-family: var(--mono); color: var(--muted); font-size: 12px; padding: 2px 4px; border-radius: 5px; }
.reg-link:hover { background: var(--hover); color: var(--text); }
.rotary { width: 110px; height: 44px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel2); font-weight: 800; letter-spacing: 1px; font-size: 14px; }
.rotary.fast { background: var(--organ); color: #fff; border-color: var(--organ); box-shadow: 0 0 14px var(--accent-soft); }

/* Keys */
.ctl-row.line { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); align-items: flex-end; }
.voice-btn.open { border-color: var(--accent); }
.fx-pair { display: flex; align-items: flex-end; gap: 4px; }
.vp-inline { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel2); padding: 10px; }
.vp-top { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.vp-top input { flex: 1; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); outline: none; }
.vp-inline .vp-list { max-height: 240px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 3px; overflow: auto; }
.vp-inline .vp-group { grid-column: 1 / -1; }
.fx-block { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; min-width: 220px; }
.fx-title .switch .lbl { font-weight: 700; }

/* Avancé */
.adv-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-bottom: 12px; }
.adv-grid > div { display: flex; flex-direction: column; gap: 10px; }
.zone-row { display: flex; align-items: flex-end; gap: 6px; }
.all-params { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; margin-top: 10px; }

/* Tiroirs à droite */
.scrim { position: fixed; left: 330px; top: 60px; right: 0; bottom: 0; background: rgba(30,20,10,.18); z-index: 20; }
.drawer-r { position: fixed; top: 60px; right: 0; bottom: 0; width: 380px; background: var(--bg2); border-left: 1px solid var(--line); box-shadow: -12px 0 40px rgba(40,25,10,.18); z-index: 25; display: flex; flex-direction: column; animation: ycSlide .22s ease-out; }
.drawer-r.wide { width: 440px; overflow: auto; }
@keyframes ycSlide { from { transform: translateX(100%); } to { transform: none; } }
.lib-top { padding: 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.lib-top input { padding: 7px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); outline: none; }
.lib-top .chips { display: flex; gap: 5px; flex-wrap: wrap; }
.lib-list { flex: 1; overflow: auto; padding: 6px 8px; }
.lib-hint { color: var(--muted); font-size: 11.5px; padding: 6px 6px 8px; }
.lib-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; border: 1px solid transparent; cursor: grab; }
.lib-item:hover { background: var(--hover); }
.lib-item.sel { background: var(--accent-soft); border-color: var(--accent); }
.lib-item .fav { background: none; border: 0; color: var(--amber); padding: 0 2px; font-size: 14px; }
.li-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.li-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li-desc { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#setDrawer .set-body { padding: 16px 20px 30px; }
.set-actions.col { flex-direction: column; align-items: stretch; }
.btn.danger { color: var(--accent); }

/* Moniteur MIDI */
.logbox { position: fixed; right: 12px; bottom: 12px; width: 620px; height: 300px; background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; z-index: 40; display: flex; flex-direction: column; box-shadow: 0 18px 50px rgba(40,25,10,.25); }
.logbox-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.logbox pre { flex: 1; margin: 0; overflow: auto; padding: 8px 12px; font: 11px/1.5 var(--mono); color: var(--muted); user-select: text; }
.logbox pre .out { color: var(--accent); }
.logbox pre .in { color: var(--ok); }
.toast { bottom: 20px; display: flex; align-items: center; gap: 12px; }
.toast-act { color: #ffb4a8; font-weight: 700; }
.row-btns .btn, .empty-state .btn { margin-top: 4px; }
.empty-state .row-btns { justify-content: center; margin-top: 14px; }
.voice-btn > span:first-child { display: flex; flex-direction: column; align-items: flex-start; }
.voice-btn { min-width: 210px; }
.sect.fx .ctl-row { align-items: stretch; }
/* colonne des pages en boucle : pas d'ascenseur */
#sideList { scrollbar-width: none; }
#sideList::-webkit-scrollbar { display: none; width: 0; }
.pend-list { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; margin: 4px 0; max-height: 160px; overflow: auto; }
.pend-list .link { font-size: 12px; }
.lib-selbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--accent-soft); border-bottom: 1px solid var(--line); font-size: 12.5px; }
.lib-item.msel { background: var(--accent-soft); border-color: var(--accent2); }
.pend-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
.pend-btns .btn { justify-content: center; text-align: center; }
.sect.live { background: linear-gradient(var(--tint-neutral), var(--panel) 70%); }
.sect.live .bar { background: var(--text); }
.menu-bar { display: flex; align-items: center; gap: 4px; width: 100%; margin-top: 12px; padding: 6px 2px 0; border: 0; border-top: 1px dashed var(--line); background: none; font-size: 12px; font-weight: 600; color: var(--text); text-align: left; }
.menu-bar .muted { font-weight: 400; }
.menu-bar:hover { color: var(--accent); }
.sect-menu { margin-top: 8px; padding: 10px 12px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.raw-wrap { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.zones-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 8px 24px; }
.zone-row .switch { min-width: 88px; }
.topbar .btn.icon.hist { width: 20px; font-size: 11px; margin: 0 -6px; color: var(--muted); }
.hist-pop { display: flex; flex-direction: column; gap: 6px; width: 380px; }
.hist-list { display: flex; flex-direction: column; max-height: 420px; overflow: auto; }
.hist-item { display: flex; gap: 8px; align-items: baseline; text-align: left; background: none; border: 0; padding: 6px 8px; border-radius: 6px; font-size: 12.5px; }
.hist-item:hover { background: var(--hover); }
.hist-item.undone { color: var(--dim); font-style: italic; }
.hi-ic { color: var(--muted); flex: none; }
.hist-now { font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--accent); border-top: 1px solid var(--accent); margin: 4px 0; padding-top: 2px; }
.title-wrap { display: flex; align-items: center; justify-content: center; gap: 14px; }
.store-btn { flex: none; height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel2); color: var(--dim); font-weight: 800; letter-spacing: 1px; font-size: 12px; }
.store-btn.armed { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 3px var(--accent-soft); animation: storePulse 1.6s ease-in-out infinite; cursor: pointer; }

@keyframes storePulse { 50% { box-shadow: 0 0 0 6px var(--accent-soft); } }
.mod.edit { background: var(--accent); }
.search-group { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
.search-group:focus-within { border-color: var(--accent); }
.search-group #search { border: 0; background: transparent; width: 170px; }
#filterSel { border: 0; border-left: 1px solid var(--line); background: transparent; padding: 7px 8px; height: 100%; font: inherit; font-size: 12.5px; color: var(--muted); outline: none; cursor: pointer; border-radius: 0 9px 9px 0; }

/* =================== Affichage des Live Sets =================== */
.lcd-wrap, .pads { display: none; }
.pg-lbl { margin-right: 3px; }
/* --- A & B : mini-écran façon YC --- */
body.view-lcd .lcd-wrap, body.view-lcd8 .lcd-wrap { display: flex; align-items: center; gap: 4px; }
.pg-btn { width: 26px; height: 40px; border-radius: 7px; border: 1px solid var(--line2); background: var(--panel2); font-size: 10px; color: var(--muted); }
.pg-btn:hover { color: var(--text); background: var(--hover); }
.lcd { width: 250px; height: 44px; border-radius: 6px; border: 2px solid #2a2a2a; background: #0c0f12; box-shadow: inset 0 0 12px rgba(120,170,255,.12), 0 1px 0 rgba(255,255,255,.6);
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 0 10px; text-align: left; font-family: var(--mono); color: #dfe9ff; cursor: pointer; }
.lcd-pos { font-size: 12px; color: #8fb3ff; letter-spacing: 1px; }

.tr-body::-webkit-scrollbar-track { background: transparent; }

.rw .rw-bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 4px 0 6px; }
.rw .rw-bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.rw .rw-lbl { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* tirette Reset flottante */
.reset-pop { position: fixed; z-index: 115; width: 260px; margin: 0; padding: 8px 10px; box-shadow: 0 14px 36px rgba(30,20,10,.22); border-color: var(--line2); background: var(--panel); }
.reset-pop .reset-top { display: flex; gap: 6px; padding-bottom: 6px; margin-bottom: 3px; border-bottom: 1px solid var(--line); }
.reset-pop .reset-go { justify-content: flex-end; padding-top: 6px; margin-top: 4px; border-top: 1px solid var(--line); }

/* attente de la réponse de l'IA : petite fenêtre au centre de l'écran (≈ 1/4) */
.tr-waitbox { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 25vw; min-width: 340px; max-width: 520px; z-index: 125;
  background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; box-shadow: 0 18px 48px rgba(30,20,10,.25); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; outline: none; }
.tr-waitbox .tr-wait-head { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.tr-waitbox .tr-wait-head b { flex: 1; }
.tr-waitbox .tr-wait-head .flag svg { width: 24px; height: 16px; }
.tr-waitbox .tr-wait-help { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line2); background: var(--panel); color: var(--muted); font: 700 12px system-ui; padding: 0; cursor: help; }
.tr-waitbox .tr-wait-help:hover { color: var(--accent); border-color: var(--accent); }
.tr-waitbox .tr-wait-mid { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; padding: 14px 0 6px; flex: none; }
.tr-waitbox .tr-wait-hint { text-align: center; color: var(--muted); font-size: 12px; }
.tr-wait-dots { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line2); border-top-color: var(--accent); animation: trSpin 1s linear infinite; }
@keyframes trSpin { to { transform: rotate(360deg); } }

.tr-waitbox .tr-wait-helptxt { background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.45; }
.tr-waitbox .tr-wait-helptxt[hidden] { display: none; }
.tr-waitbox .tr-wait-help.on { color: var(--accent); border-color: var(--accent); }

.tr-waitbox .tr-wait-mid.ok { color: var(--ok, #2f8a4a); font-weight: 600; }
.tr-wait-ok { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--ok, #2f8a4a); color: #fff; font-size: 12px; }

/* Ajouter une langue : téléchargeables en haut (langue de Windows en premier, plus grande), disponibles en bas */
.lang-add .lang-sec { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 6px 8px 3px; }
.lang-add .lang-sec:not(:first-child) { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; }
.lang-add .lang-grid { display: grid; grid-template-columns: repeat(3, auto); }
.lang-add .lang-first { padding: 2px 0 4px; }
.lang-add .lang-item.big { font-size: 15px; font-weight: 600; gap: 10px; }
.lang-add .lang-item.big .flag, .lang-add .lang-item.big .flag svg, .lang-add .lang-item.big .flag img { width: 30px; height: 20px; }
.flag img { width: 100%; height: 100%; display: block; object-fit: cover; }
select.fixkey { min-width: 80px; }
/* menu Ajouter une langue : sections l'une sous l'autre (Téléchargeables en haut, Disponibles en bas) */
.lang-add > div[data-noi18n] { display: block !important; }
.lang-add .lang-grid { display: grid; grid-template-columns: repeat(3, minmax(0, auto)); gap: 0 4px; }
.lang-add .lang-first .lang-item.big { padding: 6px 8px; }
.lang-add .lang-first .lang-item.big .flag, .lang-add .lang-first .lang-item.big .flag svg, .lang-add .lang-first .lang-item.big .flag img { width: 33px; height: 22px; }

.tr-back.tr-hide { visibility: hidden; }

/* liste des langues montrée au-dessus du voile pendant la mise en garde « Chargement terminé » */
#langMenu.lang-keep { z-index: 121; pointer-events: none; }

.cfm-ask { font-weight: 600; margin-top: 10px; }

.tr-table th .tr-fix-btn { margin-left: 6px; border: 1px solid var(--accent); background: var(--panel); color: var(--accent); border-radius: 6px; padding: 0 6px; font-size: 12px; line-height: 18px; cursor: pointer; }
.tr-table th .tr-fix-btn:hover { background: var(--accent); color: #fff; }

.mw .mw-welcome { font-size: 20px; font-weight: 700; margin: 2px 0 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }

/* Live Set pas encore lu : façade complète grisée, seule la partie LIVE SET reste utilisable */
.fac-band.fac-ph > .yp-sec:not(.liveset), .fac-band.fac-ph > div:not(.liveset):not(.fac-empty) { opacity: .45; pointer-events: none; filter: grayscale(.4); }

/* voyant de connexion : YC absent → clignote (flash) pour inviter à rouvrir Connexions MIDI */
#conn.flash .dot { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); animation: connFlash .9s steps(1, end) infinite; }
@keyframes connFlash { 50% { opacity: .12; } }

/* mode démo */
.demo-btn { margin-left: 6px; border: 1px solid var(--accent); color: var(--accent); background: var(--panel); }
.demo-btn.on { background: var(--accent); color: #fff; }
body.demo-on .topbar { box-shadow: inset 0 -3px 0 var(--accent); }
/* façade : STORE légèrement teinté de rouge quand il y a un changement à enregistrer (passe devant le blanc des boutons de la façade) */
.fac-band.yp .pb.store-w.armed .pb-b.white { background: linear-gradient(#ffb3a6 0 55%, #ee7f6c 55% 100%) !important; color: #5c0f07 !important; box-shadow: 0 0 0 2px rgba(214,59,44,.5); }
/* version web : sons de la communauté en deux étapes (télécharger, puis choisir ou déposer l'archive) */
.comm-steps { display: flex; flex-direction: column; gap: 8px; margin: 10px 0 4px; }
.comm-steps .btn { align-self: flex-start; text-decoration: none; }
.comm-drop { border: 2px dashed var(--line2); border-radius: 8px; padding: 18px 12px; text-align: center; color: var(--muted); cursor: pointer; }
.comm-drop:hover, .comm-drop.over { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }

</style>
</head>

  const KEYS_CATEGORIES = ['Piano', 'E.Piano', 'Synth', 'Others'];
  const keysVoice = (num) => KEYS_VOICES.find((v) => v.num === num);
  const FM_KEYS = new Set(KEYS_VOICES.filter((v) => v.name.startsWith('FM') || v.sub === 'FM' || v.sub === 'Vintage FM' || v.sub === 'Comp').map((v) => v.num));

  // ---------- Effets ----------
  const FX_COMMON = {
    0x00: 'G Chorus', 0x01: 'SPX Chorus', 0x02: 'Symphonic', 0x03: '816 Chorus', 0x04: 'VCM Flanger',

  function getVal(bytes, p) {
    if (p.t === 'u14') return ((bytes[p.o] & 0x7F) << 7) | (bytes[p.o + 1] & 0x7F);
    if (p.t === 'name') {
      let s = '';
      for (let i = 0; i < p.len; i++) s += String.fromCharCode(bytes[p.o + i] || 32);
      return s.replace(/\s+$/, '');
    }
    return bytes[p.o];
  }
  function setVal(bytes, p, v) {
    if (p.t === 'u14') { bytes[p.o] = (v >> 7) & 0x7F; bytes[p.o + 1] = v & 0x7F; return [p.o, 2]; }
    if (p.t === 'name') {

/* YC Studio — version web de démonstration (chargé seulement par tools/web/mkweb.py, jamais dans l'exe).
   Le YC virtuel du mode démo est branché d'office ; rien n'est enregistré d'une visite à l'autre.
   Ce module complète l'objet `sys` du mode navigateur : archives .zip (lecture et écriture) et sons de la communauté. */
'use strict';
window.__ycWeb = true;
window.ycWeb = (function () {
  /* ---- CRC-32 (en-têtes zip) ---- */
  const CRC = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; CRC[n] = c >>> 0; }

let cancelFlag = false;
function setBusy(label, p) {
  state.busy = label;
  if (readWin && label) { readWin.lbl.textContent = label; readWin.bar.style.width = Math.round((p || 0) * 100) + '%'; }
  const pr = $('#progress'); pr.hidden = !label || !!(readWin && readWin.box.isConnected && !$('#modalBack').hidden);   /* la fenêtre de première lecture montre déjà l'avancement */
  if (label) { $('#progressLabel').textContent = label; pr.querySelector('.pg-bar > div').style.width = Math.round((p || 0) * 100) + '%'; }

}
$('#progressCancel').onclick = () => (cancelFlag = true);
const readAll = () => readRange(readOrderFrom(state.sel && state.sel.kind === 'device' ? state.sel.idx : 0));
// Lecture avec file d'attente : un slot cliqué pendant la lecture passe en tête
let readQueue = [];
function readFirst(idx) { if (!state.busy) return readRange([idx]); readQueue = [idx, ...readQueue.filter((i) => i !== idx)]; }
// Relit une page à la demande (quand on l'ouvre), seulement les slots pas encore relus pendant cette session
const fresh = new Set();
function ensurePage(p, first) {
  if (!midi.connected || p < 0) return;
  const list = [];
  if (first != null) list.push(first);
  for (let s = 0; s < 8; s++) list.push(p * 8 + s);
  const todo = [...new Set(list)].filter((i) => !state.device[i].sound && !state.device[i].dirty);   // la copie locale suffit : on ne relit que ce qu'on n'a jamais lu
  if (!todo.length) return;
  if (!state.busy) return readRange(todo, { quiet: true });
  readQueue = [...todo, ...readQueue.filter((i) => !todo.includes(i))];
}
async function readRange(list, opt = {}) {
  if (!midi.connected) return;
  if (state.busy) { readQueue.push(...list.filter((i) => !readQueue.includes(i))); return; }
  cancelFlag = false; let ok = 0, done = 0;
  readQueue = list.slice();
  const total = () => done + readQueue.length;
  while (readQueue.length && !cancelFlag) {
    const i = readQueue.shift();
    if (state.device[i].dirty || (state.edit && state.edit.idx === i && editing())) { done++; continue; }
    setBusy(total() + 1 > 1 ? `Lecture du clavier… ${done + 1} / ${total() + 1}` : `Lecture ${slotLabel(i)}…`, done / (total() + 1));
    try {
      const snd = await midi.readSoundSafe(Math.floor(i / 8), i % 8);
      if (!state.device[i].dirty && !(state.edit && state.edit.idx === i)) state.device[i] = { sound: snd, dirty: false };
      fresh.add(i); ok++;
      // le son actif du clavier est retrouvé : on s'y place si l'utilisateur n'a pas bougé
      if (opt.matchKey && JSON.stringify(snd.blocks) === opt.matchKey) {
        opt.matchKey = null;
        if (state.sel && state.sel.kind === 'device' && state.sel.idx === opt.startIdx && i !== opt.startIdx) select({ kind: 'device', idx: i }, { fromKeyboard: true });
      }
    } catch (e) { if (ok === 0) { readQueue = []; setBusy(null); toast(e.message, true); renderEditor(); return; } }
    done++;
    const inOpenPage = Math.floor(i / 8) === state.openPage;
    if (inOpenPage || done % 8 === 0) schedulePages();
    if (state.sel && state.sel.kind === 'device' && state.sel.idx === i) renderEditor();
  }
  readQueue = [];
  setBusy(null); scheduleSave(); renderPages(); if (!cur() || isPh(cur())) renderEditor();
  if (total() > 1 && !opt.quiet) toast(`${ok} son(s) lu(s) dans le clavier` + (cancelFlag ? ' — interrompu.' : '.'));
}

// Ordre de lecture : le slot en cours, le reste de sa page, puis les pages suivantes (en bouclant)
function readOrderFrom(idx) {
  const p = Math.floor(idx / 8), out = [idx];
  for (let s = 0; s < 8; s++) if (p * 8 + s !== idx) out.push(p * 8 + s);

  return out;

// Retrouve le Live Set actif sur le clavier : son du tampon courant comparé à la copie locale
let currentKey = null, currentSnd = null, currentAmbig = null;
async function findCurrentSlot() {
  let curSnd = null; currentSnd = null;
  try { curSnd = await midi.readSoundSafe('current'); currentKey = JSON.stringify(curSnd.blocks); currentSnd = curSnd; } catch { /* ignore */ }
  const last = clamp(Number(state.settings.lastIdx) || 0, 0, TOTAL - 1);
  if (curSnd) {
    const key = JSON.stringify(curSnd.blocks);
    const same = (i) => state.device[i].sound && JSON.stringify(state.device[i].sound.blocks) === key;
    const hits = state.device.map((d, i) => i).filter(same);
    currentAmbig = hits.length > 1 ? hits : null;   /* plusieurs Live Sets identiques (ex. « Init Sound ») : impossible de savoir lequel */
    if (hits.includes(last)) { currentKey = null; return last; }
    if (hits.length) { currentKey = null; return hits[0]; }
    // pas d'identique (son modifié, ou octets non mémorisés qui diffèrent) : même nom dans la copie locale
    // (comparaison en mémoire, aucune lecture du clavier) ; plusieurs homonymes → le plus ressemblant, le dernier utilisé d'abord
    const nm = YC.soundName(curSnd);
    const cands = state.device.map((d, i) => i).filter((i) => state.device[i].sound && YC.soundName(state.device[i].sound) === nm);
    if (cands.length) {
      /* homonymes : on compare aussi le contenu ; le plus proche du son en cours l'emporte. Doute seulement si plusieurs sont aussi proches l'un que l'autre */
      const score = (i) => YC.BLOCKS.reduce((n, b) => { const a = state.device[i].sound.blocks[b.id] || [], c = curSnd.blocks[b.id] || []; return n + a.filter((x, k) => x === c[k]).length; }, 0);
      const sc = new Map(cands.map((i) => [i, score(i)])), best = Math.max(...sc.values());
      const tops = cands.filter((i) => sc.get(i) === best);

      currentKey = null; return tops.includes(last) ? last : tops[0];
    }
    if (state.device.every((d) => d.sound)) currentAmbig = [last, -1];   /* aucun identique ni homonyme dans une copie complète : on demande (copie incomplète : la lecture du clavier retrouvera le set) */
  }

}
// Au démarrage : la façade affichée = le tampon réel du clavier. Si le Live Set a été modifié sur le

async function syncWithEditBuffer(idx) {

  // Nom différent = autre Live Set choisi appli fermée (cas rare) : on ne fait rien.
  const live = currentSnd, s = state.device[idx].sound; if (!live || !s || curDeviceIdx() !== idx || state.ambig) return;   /* set incertain : on n'écrit rien dans la copie */
  if (YC.soundName(live) !== YC.soundName(s)) return;
  const changed = YC.BLOCKS.filter((b) => JSON.stringify(live.blocks[b.id]) !== JSON.stringify(s.blocks[b.id])).map((b) => b.id);
  if (!changed.length) return;
  state.edit = null;
  state.device[idx] = { sound: live, dirty: false }; fresh.add(idx);
  monNote('démarrage : copie de ' + slotLabel(idx) + ' mise à jour depuis le clavier (' + changed.join(', ') + ')');
  state.keysPart = YC.getVal(live.blocks.common, P('common', 'keysSel')) === 1 ? 'keysB' : 'keysA';
  scheduleSave(); renderEditor(); updateTitle(); renderPages();

async function importFiles(opt = {}) {
  const files = opt.files || await sys.openFiles({ folder: !!opt.folder, filters: [opt.ext ? { name: (window.I18N ? I18N.t : (x) => x)({ Y0L: 'Live Set All File (.Y0L)', Y0P: 'Live Set Page File (.Y0P)', Y0S: 'Live Set Sound File (.Y0S)', syx: 'Sons SysEx Yamaha (.syx)', zip: 'Bibliothèque (.zip de .syx)' }[opt.ext]), extensions: [opt.ext, opt.ext.toUpperCase()] } : { name: (window.I18N ? I18N.t : (x) => x)('Sauvegardes du clavier YC (.Y0L, .Y0P, .Y0S)'), extensions: ['Y0L', 'Y0P', 'Y0S', 'y0l', 'y0p', 'y0s'] }] });

    if (!YC.soundName(sound).trim()) YC.setVal(sound.blocks.common, YC.COMMON[0], fileName.replace(/\.[^.]+$/, '').slice(0, 15));
    const l = { id: uid(), sound, fav: false, tags: [], added: Date.now(), updated: Date.now() };
    if (tag) l.tags.push(tag);
    if (extraTag) l.tags.push(extraTag);

    if (f && f.length <= 24 && !/^(yc|yc61|yc73|yc88|syx|mid|sysex|patches|soundmondo|communaute|reface)$/.test(f) && !/soundmondo-yc/.test(f)) l.tags.push(f);
    state.library.push(l); added++;

        for (const l of data.library || data.sounds || []) addSound(clone(l.sound || l), f.name, '');

  const b = YCSyx.parseBulk(arr);

  const foot = dr.querySelector('.set-foot'), H = dr.clientHeight - (foot ? foot.offsetHeight : 0);

  body.style.zoom = 1; body.style.height = H + 'px'; body.style.setProperty('--sp', '0px');

  const inField = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  const k = e.key.toLowerCase();
  if (!WEB && e.ctrlKey && !e.shiftKey && !e.altKey && k === 'q') { e.preventDefault(); quitApp(); return; }
  if (e.ctrlKey && k === 'f') { e.preventDefault(); if (lcdMode()) openSets(true); document.body.classList.remove('rail-shut'); setTimeout(() => { $('#search').focus(); $('#search').select(); }, 30); return; }
  if (inField) { if (e.key === 'Escape') document.activeElement.blur(); return; }
  if (state.drawer === 'lib' && e.key === 'Delete') {
    e.preventDefault();
    if (state.libSel.size) deleteLibMany([...state.libSel]);
    else if (state.sel && state.sel.kind === 'lib') deleteLibMany([state.sel.id]);
    return;
  }
  if (state.drawer === 'lib' && e.ctrlKey && k === 'a') { e.preventDefault(); libVisible.forEach((l) => state.libSel.add(l.id)); markLibSel(); return; }
  if (e.ctrlKey && k === 's') { e.preventDefault(); storeCurrent(); return; }
  if (e.ctrlKey && k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  else if (e.ctrlKey && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }

/* fenêtres de confirmation (et autres fenêtres centrées) : on les déplace en les tirant */

/* Correction en direct : maintenir Alt, survoler (l'élément s'allume, sa bulle d'aide est affichée par l'appli), cliquer → petite fenêtre de correction */
(function altFix() {
  let on = false, hit = null, tip = null;
  const clear = () => { if (hit) hit.classList.remove('alt-hit'); hit = null; if (tip) { tip.remove(); tip = null; } };
  const pick = (t) => { for (let el = t, k = 0; el && el !== document.body && k < 4; el = el.parentElement, k++) { if (el.closest('#altFix, .alt-tip')) return null; const src = I18N.sourcesOf(el); if (src.length) return { el, src }; } return null; };
  const show = (x, y, target) => {
    const p = pick(target); const node = p && p.el;
    if (node === hit) { if (tip) place(x, y); return; }
    clear(); if (!p) return;
    hit = node; node.classList.add('alt-hit');
    const t = node.getAttribute('title'); if (t) { tip = el('div', { class: 'alt-tip', 'data-noi18n': '' }, t); document.body.append(tip); place(x, y); }
  };
  const place = (x, y) => { tip.style.left = clamp(x + 14, 4, innerWidth - tip.offsetWidth - 4) + 'px'; tip.style.top = clamp(y + 18, 4, innerHeight - tip.offsetHeight - 4) + 'px'; };
  let lx = 0, ly = 0, lt = null;
  document.addEventListener('mousemove', (e) => { lx = e.clientX; ly = e.clientY; lt = e.target; if (on) show(lx, ly, lt); }, true);
  document.addEventListener('keydown', (e) => { if (e.key === fixKey() && !e.repeat) { if (fixKey() === 'Alt') e.preventDefault(); if (!on) { on = true; document.body.classList.add('alt-on'); if (lt) show(lx, ly, lt); } } }, true);
  const off = () => { on = false; document.body.classList.remove('alt-on'); clear(); };
  document.addEventListener('keyup', (e) => { if (e.key === fixKey()) { if (fixKey() === 'Alt') e.preventDefault(); off(); } }, true);
  window.addEventListener('blur', off);
  const block = (e) => { if (on && hit) { e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); } };
  ['pointerdown', 'mousedown', 'mouseup', 'dblclick', 'contextmenu'].forEach((t) => document.addEventListener(t, block, true));
  document.addEventListener('click', (e) => { if (!on || !hit) return; e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); const target = hit, src = I18N.sourcesOf(target); off(); editor(target, src); }, true);
  function editor(target, src) {
    const old = $('#altFix'); if (old) old.remove();
    const L = state.settings.lang || 'fr', over = state.settings.i18nOver || (state.settings.i18nOver = {});
    const NAME = Object.fromEntries(I18N.LANGS);
    const val = (e) => (over[e.fr] && over[e.fr][L] != null ? over[e.fr][L] : L === 'fr' ? e.fr : (e[L] ?? ''));
    const inputs = [];
    const rows = src.map(({ kind, e }) => {
      const ta = el('textarea', { rows: 1, class: 'tr-in' }); ta.value = val(e); inputs.push([ta, e]);
      ta.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); save(); } else if (ev.key === 'Escape') { ev.preventDefault(); box.remove(); } });
      return el('div', { class: 'af-row' }, el('div', { class: 'af-k' }, kind === 'title' ? 'Bulle d’aide' : 'Texte'),
        L !== 'en' ? el('div', { class: 'af-en', 'data-noi18n': '' }, flagEl('en'), ' ', String(e.en || e.fr)) : null,
        el('div', { class: 'af-in' }, el('span', { 'data-noi18n': '' }, flagEl(L)), ta));
    });
    function save() {
      trChange(() => { for (const [ta, e] of inputs) { const v = ta.value, base = L === 'fr' ? e.fr : (e[L] ?? ''); if (v === base || (L === 'fr' && !v.trim())) { if (over[e.fr]) delete over[e.fr][L]; } else (over[e.fr] || (over[e.fr] = {}))[L] = v; } scheduleSave(); applyLang(); }, 'Traduction ' + L.toUpperCase() + ' : « ' + src[0].e.fr.slice(0, 40) + ' »');
      box.remove(); toast('Traduction corrigée.');
    }
    const box = el('div', { id: 'altFix', class: 'alt-fix' },
      el('div', { class: 'af-head' }, el('b', null, 'Corriger la traduction'), el('span', { 'data-noi18n': '', class: 'af-lang' }, NAME[L] || L), el('span', { class: 'spacer' }), el('button', { class: 'ft-x', title: 'Fermer', onclick: () => box.remove() }, '×')),
      rows,
      el('div', { class: 'af-foot' }, el('button', { class: 'link', onclick: () => { box.remove(); const e = src[0].e; openTranslations({ g: e.g, fr: e.fr }); } }, 'Ouvrir dans le tableau'), el('span', { class: 'spacer' }),
        el('button', { class: 'btn small primary', onclick: save }, 'Valider'), el('button', { class: 'btn small ghost', onclick: () => box.remove() }, 'Annuler')));
    document.body.append(box);
    const r = target.getBoundingClientRect();
    box.style.left = clamp(r.left, 6, innerWidth - box.offsetWidth - 6) + 'px';
    box.style.top = (r.bottom + 8 + box.offsetHeight < innerHeight ? r.bottom + 8 : Math.max(6, r.top - box.offsetHeight - 8)) + 'px';
    inputs[0][0].focus(); inputs[0][0].select();
    const outside = (ev) => { if (!box.isConnected) return document.removeEventListener('pointerdown', outside, true); if (!box.contains(ev.target)) { box.remove(); document.removeEventListener('pointerdown', outside, true); } };
    setTimeout(() => document.addEventListener('pointerdown', outside, true), 0);
  }
})();
